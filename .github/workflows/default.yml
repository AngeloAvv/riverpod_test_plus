name: Pipeline

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    name: Analyze ${{ matrix.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - .
          - example
        include:
          - flutter: false
          - flutter: true
            working-directory: example
    uses: ./.github/workflows/analyze.yml
    with:
      working-directory: ${{ matrix.working-directory }}
      flutter: ${{ matrix.flutter }}

  test:
    name: Test ${{ matrix.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - .
          - example
        include:
          - flutter: false
          - flutter: true
            working-directory: example
    uses: ./.github/workflows/test.yml
    with:
      working-directory: ${{ matrix.working-directory }}
      flutter: ${{ matrix.flutter }}

  format:
    name: Format idempotency gate
    runs-on: ubuntu-latest
    needs:
      - analyze
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1.8.1

      - name: Get dependencies
        run: dart pub get --no-example

      - name: Check dart format idempotency
        run: dart format --set-exit-if-changed .

  dry_run_publish:
    name: Dry-run publish check
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1.8.1

      - name: Get dependencies
        run: dart pub get --no-example

      - name: Dry-run publish
        run: dart pub publish --dry-run

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [analyze, test, format, dry_run_publish]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
