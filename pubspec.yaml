name: riverpod_test_plus
description: >-
  Test any Riverpod provider with a single function. One signature for Provider,
  FutureProvider, StreamProvider, Notifier, AsyncNotifier, StreamNotifier,
  families and mutations, asserting on the sequence they emit.
version: 0.1.0
repository: https://github.com/AngeloAvv/riverpod_test_plus
homepage: https://docs.page/AngeloAvv/riverpod_test_plus
issue_tracker: https://github.com/AngeloAvv/riverpod_test_plus/issues
topics:
  - riverpod
  - testing
  - test
  - state-management

environment:
  sdk: ^3.12.0

dependencies:
  diff_match_patch: ^0.4.1
  meta: ^1.17.0
  riverpod: ^3.4.3
  test: ^1.25.0

dev_dependencies:
  lints: ^6.1.0
